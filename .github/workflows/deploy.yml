name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Install Font Awesome 7
        run: |
          FA_VERSION=$(gh api repos/FortAwesome/Font-Awesome/releases/latest --jq '.tag_name')
          gh release download "${FA_VERSION}" \
            --repo FortAwesome/Font-Awesome \
            --pattern "fontawesome-free-*-desktop.zip" \
            --dir /tmp
          unzip -q /tmp/fontawesome-free-*-desktop.zip -d /tmp/fontawesome
          FA_FONT_DIR=$(find /tmp/fontawesome -type d -name 'otfs' | head -1)
          echo "FA_FONT_DIR=${FA_FONT_DIR}" >> "${GITHUB_ENV}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile CV to PDF
        run: typst compile --font-path "${FA_FONT_DIR}" curriculum-vitae.typ curriculum-vitae.pdf

      - name: Compile CV to PNG
        run: typst compile --format png --ppi 300 --font-path "${FA_FONT_DIR}" curriculum-vitae.typ curriculum-vitae-{0p}.png

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp curriculum-vitae.pdf _site/
          cp curriculum-vitae-*.png _site/

          PNG_FILES=$(ls -1 _site/curriculum-vitae-*.png | sort)
          PNG_ITEMS=""
          for png in ${PNG_FILES}; do
            name=$(basename "${png}")
            PNG_ITEMS="${PNG_ITEMS}<li><a href=\"${name}\"><img src=\"${name}\" alt=\"${name}\" style=\"max-width:100%;\"></a></li>"
          done

          cat > _site/index.html <<HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>CV - Mickaël Canouil</title>
          <style>
          body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f5; }
          .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
          h1 { font-size: 1.5rem; }
          a { color: #0969da; }
          object { width: 100%; height: 80vh; border: 1px solid #ddd; border-radius: 4px; }
          .pages { list-style: none; padding: 0; }
          .pages li { margin: 1rem 0; }
          .pages img { border: 1px solid #ddd; border-radius: 4px; }
          </style>
          </head>
          <body>
          <div class="container">
          <h1>Curriculum Vitae - Mickaël Canouil</h1>
          <p><a href="curriculum-vitae.pdf">Download PDF</a></p>
          <object data="curriculum-vitae.pdf" type="application/pdf">
          <p>PDF cannot be displayed. <a href="curriculum-vitae.pdf">Download it instead.</a></p>
          </object>
          <h2>Pages</h2>
          <ul class="pages">${PNG_ITEMS}</ul>
          </div>
          </body>
          </html>
          HTMLEOF

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
