profile:
- text: 'Postdoctoral researcher with a professional background in conservation, specialising in socio-environmental systems modelling to support evidence-based policy and planning. Passionate about advancing open science, communicating research beyond academia, and mentoring others in modelling, programmatic data analysis, and visualisation. Experienced in managing small and large teams, especially in cross-cultural and interdisciplinary settings, with a strong commitment to collaborative and inclusive research.'
